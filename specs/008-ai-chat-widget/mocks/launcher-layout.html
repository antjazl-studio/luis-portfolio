<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>008 launcher layout options (mock)</title>
<style>
:root{--bg:#050505;--fg:#fff;--surface:#0e0e10;--muted:#a1a1aa;--border:#27272a;--bs:#71717a}
body{margin:0;background:#111;color:var(--fg);font:14px system-ui,sans-serif;padding:24px}
h1{font-size:18px;font-weight:500}p{color:var(--muted);max-width:60ch}
.row{display:flex;gap:32px;flex-wrap:wrap}
figure{margin:0}figcaption{margin:8px 0;color:var(--muted)}
.phone{position:relative;width:360px;height:640px;background:var(--bg);border:1px solid var(--bs);border-radius:14px;overflow:hidden}
.phone .page{padding:20px;color:var(--muted)}
.fab{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9999px}
.wa{background:#25D366;width:48px;height:48px;right:16px;bottom:16px}
.chat{background:var(--bg);border:1px solid var(--bs);color:var(--fg);height:48px}
.chat span{font-size:14px;font-weight:500}
/* A: stacked, icon-only round */
.A .chat{width:48px;right:16px;bottom:76px}
/* B: stacked, pill with label */
.B .chat{padding:0 18px;right:16px;bottom:76px;gap:8px}
/* C: side by side */
.C .chat{padding:0 18px;right:76px;bottom:16px;gap:8px}
</style></head><body>
<h1>Option mocks: launcher vs WhatsApp (360px, closed panel, flat, no shadow)</h1>
<p>Chat launcher uses a neutral outline (border-strong) on ink black. WhatsApp keeps its brand green. Accent blue is not used on either.</p>
<div class="row">
<figure><div class="phone A"><div class="page">Page content</div><div class="fab chat"><span>AI</span></div><div class="fab wa"></div></div><figcaption>A. Stacked, round icon-only "AI" above WhatsApp (needs aria-label; least explicit)</figcaption></figure>
<figure><div class="phone B"><div class="page">Page content</div><div class="fab chat"><span>Ask about Luis</span></div><div class="fab wa"></div></div><figcaption>B. Stacked, labelled pill above WhatsApp (self-explanatory; recommended)</figcaption></figure>
<figure><div class="phone C"><div class="page">Page content</div><div class="fab chat"><span>Ask about Luis</span></div><div class="fab wa"></div></div><figcaption>C. Side by side, labelled pill left of WhatsApp (uses width; tight at 360px)</figcaption></figure>
</div></body></html>
